<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>リズムあそび ♪</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Fredoka+One&display=swap');

  :root {
    --bg: #fff9f0;
    --primary: #ff6b9d;
    --primary-dark: #e0457a;
    --secondary: #ffd93d;
    --accent: #6bcb77;
    --accent2: #4d96ff;
    --text: #3a2f4e;
    --card-bg: #ffffff;
    --shadow: 0 4px 20px rgba(255,107,157,0.15);
    --radius: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    background-image: radial-gradient(circle at 20% 20%, #ffe0ef55 0%, transparent 50%),
                      radial-gradient(circle at 80% 80%, #d0f0ff55 0%, transparent 50%);
  }

  h1 {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    color: var(--primary);
    text-shadow: 3px 3px 0 #ffe0ef;
    margin: 12px 0 4px;
    letter-spacing: 1px;
  }

  /* ===== SCREENS ===== */
  .screen { display: none; width: 100%; max-width: 680px; animation: fadeIn .3s ease; }
  .screen.active { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }

  /* ===== TOP ===== */
  .mascot { font-size: 5rem; animation: bounce 2s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

  .level-cards { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .level-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 20px 28px;
    text-align: center;
    cursor: pointer;
    box-shadow: var(--shadow);
    border: 3px solid transparent;
    transition: all .2s;
    min-width: 160px;
  }
  .level-card:hover { transform: translateY(-4px); border-color: var(--primary); }
  .level-card.locked { opacity: .45; cursor: not-allowed; }
  .level-card .lv-num { font-family: 'Fredoka One', cursive; font-size: 2rem; color: var(--primary); }
  .level-card .lv-name { font-size: .85rem; color: #888; margin-top: 4px; }
  .level-card .lv-stars { font-size: 1.2rem; margin-top: 6px; }

  /* ===== SOUND TOGGLE ===== */
  .sound-toggle {
    display: flex; gap: 8px; background: #f0f0f0; border-radius: 50px; padding: 4px;
  }
  .sound-toggle button {
    border: none; background: transparent; padding: 8px 18px; border-radius: 50px;
    cursor: pointer; font-size: .85rem; font-family: inherit; transition: all .2s;
  }
  .sound-toggle button.active { background: var(--primary); color: #fff; font-weight: 700; }

  /* ===== GAME SCREEN ===== */
  .hud {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; background: var(--card-bg); border-radius: var(--radius);
    padding: 10px 20px; box-shadow: var(--shadow);
  }
  .hud-level { font-weight: 900; font-size: 1rem; color: var(--primary); }
  .hud-score { font-size: .9rem; }
  .hud-correct { font-size: .9rem; color: var(--accent); font-weight: 700; }

  .progress-bar-wrap { width: 100%; height: 12px; background: #eee; border-radius: 99px; overflow: hidden; }
  .progress-bar { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); border-radius: 99px; transition: width .4s ease; }

  /* ===== RHYTHM DISPLAY ===== */
  .rhythm-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 24px 16px 12px;
    box-shadow: var(--shadow);
    width: 100%;
    text-align: center;
  }
  .rhythm-label { font-size: .8rem; color: #aaa; margin-bottom: 8px; }
  .rhythm-svg-wrap { overflow-x: auto; }

  .play-btn {
    background: var(--primary); color: #fff; border: none; border-radius: 50px;
    padding: 10px 32px; font-size: 1rem; font-family: inherit; font-weight: 700;
    cursor: pointer; margin-top: 12px; box-shadow: 0 4px 12px rgba(255,107,157,.35);
    transition: all .2s; display: inline-flex; align-items: center; gap: 8px;
  }
  .play-btn:hover { transform: scale(1.05); }
  .play-btn:active { transform: scale(.97); }

  /* ===== CHOICES ===== */
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
  .choice-btn {
    background: var(--card-bg); border: 3px solid #e8e0f0; border-radius: var(--radius);
    padding: 12px 8px; cursor: pointer; transition: all .2s;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }
  .choice-btn:hover:not(:disabled) { border-color: var(--primary); transform: translateY(-2px); }
  .choice-btn.correct { border-color: var(--accent); background: #efffef; animation: pop .3s ease; }
  .choice-btn.wrong   { border-color: #ff6b6b; background: #fff0f0; animation: shake .3s ease; }
  .choice-btn:disabled { cursor: default; }

  @keyframes pop   { 0%{transform:scale(1)} 50%{transform:scale(1.06)} 100%{transform:scale(1)} }
  @keyframes shake { 0%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} 100%{transform:translateX(0)} }

  /* ===== FEEDBACK ===== */
  .feedback {
    font-size: 1.4rem; font-weight: 900; padding: 10px 24px;
    border-radius: 50px; display: none;
  }
  .feedback.show { display: block; animation: fadeIn .2s ease; }
  .feedback.ok  { background: #d4fde2; color: #1a8c3f; }
  .feedback.ng  { background: #ffe0e0; color: #c03030; }

  /* ===== RESULT SCREEN ===== */
  .result-card {
    background: var(--card-bg); border-radius: var(--radius);
    padding: 32px 24px; text-align: center; box-shadow: var(--shadow);
    width: 100%;
  }
  .result-card h2 { font-family: 'Fredoka One', cursive; font-size: 2rem; color: var(--primary); }
  .result-score { font-size: 3rem; font-weight: 900; color: var(--accent2); margin: 12px 0; }
  .result-msg { color: #666; margin-bottom: 20px; }

  /* ===== BUTTONS ===== */
  .btn {
    border: none; border-radius: 50px; padding: 12px 32px;
    font-family: inherit; font-size: 1rem; font-weight: 700;
    cursor: pointer; transition: all .2s;
  }
  .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(255,107,157,.4); }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(255,107,157,.5); }
  .btn-secondary { background: #f0f0f0; color: #666; }
  .btn-secondary:hover { background: #e0e0e0; }
  .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  /* ===== LEVELUP BANNER ===== */
  #levelup-banner {
    display:none; position:fixed; inset:0; background: rgba(0,0,0,.5);
    z-index:100; align-items:center; justify-content:center;
  }
  #levelup-banner.show { display:flex; animation:fadeIn .3s; }
  .levelup-box {
    background:#fff; border-radius:30px; padding:40px; text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  .levelup-box h2 { font-family:'Fredoka One',cursive; font-size:2.5rem; color:var(--primary); }
  .levelup-emoji { font-size:4rem; margin:12px 0; }

  /* ===== CONFETTI placeholder ===== */
  #confetti-canvas { position:fixed; inset:0; pointer-events:none; z-index:99; }

  /* staff line color */
  .staff-line { stroke: #ccc; stroke-width: 1.2; }
  .note-head { fill: #3a2f4e; }
  .note-stem { stroke: #3a2f4e; stroke-width: 2; }
  .note-flag { fill: #3a2f4e; }
  .rest-fill { fill: #3a2f4e; }
  .dot { fill: #3a2f4e; }
  .beam { fill: #3a2f4e; }
  .bar-line { stroke: #3a2f4e; stroke-width: 2; }
  .beat-mark { fill: #ffb3cd; }
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<!-- ===== TOP SCREEN ===== -->
<div id="screen-top" class="screen active">
  <div class="mascot">🎵</div>
  <h1>リズムあそび</h1>
  <p style="color:#999;font-size:.9rem;">音符のリズムをあてよう！</p>

  <div class="sound-toggle" id="sound-toggle">
    <button class="active" onclick="setSoundMode('piano')">🎹 ピアノ</button>
    <button onclick="setSoundMode('voice')">🗣️ こえ</button>
  </div>

  <div class="level-cards" id="level-cards"></div>
  <p style="color:#bbb;font-size:.8rem;margin-top:4px;">10問せいかいでレベルアップ！</p>
</div>

<!-- ===== GAME SCREEN ===== -->
<div id="screen-game" class="screen">
  <h1 style="font-size:1.6rem">リズムあそび</h1>
  <div class="hud">
    <span class="hud-level" id="hud-level">レベル1</span>
    <span class="hud-correct" id="hud-correct">✅ 0 / 10</span>
    <span class="hud-score" id="hud-score">スコア: 0</span>
  </div>
  <div class="progress-bar-wrap"><div class="progress-bar" id="progress-bar" style="width:0%"></div></div>

  <div class="rhythm-card" id="question-card">
    <div class="rhythm-label">このリズムはどれ？</div>
    <div class="rhythm-svg-wrap" id="question-svg"></div>
    <button class="play-btn" id="play-btn" onclick="playQuestion()">▶ きく</button>
  </div>

  <div class="feedback" id="feedback"></div>

  <div class="choices" id="choices"></div>
</div>

<!-- ===== RESULT SCREEN ===== -->
<div id="screen-result" class="screen">
  <div class="result-card">
    <div class="mascot" style="font-size:3.5rem">🎊</div>
    <h2 id="result-title">クリア！</h2>
    <div class="result-score" id="result-score-text">10 / 10</div>
    <p class="result-msg" id="result-msg">すばらしい！</p>
    <div class="btn-row">
      <button class="btn btn-primary" id="result-next-btn">つぎのレベルへ →</button>
      <button class="btn btn-secondary" onclick="goTop()">もどる</button>
    </div>
  </div>
</div>

<!-- LEVELUP BANNER -->
<div id="levelup-banner">
  <div class="levelup-box">
    <div class="levelup-emoji">🌟</div>
    <h2>レベルアップ！</h2>
    <p id="levelup-text" style="margin:12px 0;color:#666;"></p>
    <button class="btn btn-primary" onclick="dismissLevelup()">つぎへ！</button>
  </div>
</div>

<script>
// ===================================================
// SOUND ENGINE
// ===================================================
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function getCtx() { if (!audioCtx) audioCtx = new AudioCtx(); return audioCtx; }

let soundMode = 'piano';
function setSoundMode(m) {
  soundMode = m;
  document.querySelectorAll('#sound-toggle button').forEach((b,i)=>{
    b.classList.toggle('active', (i===0&&m==='piano')||(i===1&&m==='voice'));
  });
}

// Piano: simple FM-ish tone
function playPianoNote(freq, start, duration) {
  const ctx = getCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.type = 'triangle';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, start);
  gain.gain.linearRampToValueAtTime(0.3, start + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, start + duration * 0.9);
  osc.start(start);
  osc.stop(start + duration);
}

// Voice: use oscillator + formant-ish filter for "tan/un" syllables
function playVoiceNote(syllable, start, duration) {
  const ctx = getCtx();
  const osc = ctx.createOscillator();
  const filter = ctx.createBiquadFilter();
  const gain = ctx.createGain();
  osc.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
  osc.type = 'sawtooth';
  osc.frequency.value = syllable === 'un' ? 0 : 220;
  filter.type = 'bandpass';
  filter.frequency.value = syllable === 'ta' ? 1200 : syllable === 'n' ? 800 : 600;
  filter.Q.value = 3;
  gain.gain.setValueAtTime(syllable === 'un' ? 0 : 0, start);
  if (syllable !== 'un') {
    gain.gain.linearRampToValueAtTime(0.25, start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, start + duration * 0.85);
  }
  osc.start(start);
  osc.stop(start + duration);
}

// REST: short tick
function playTick(start) {
  const ctx = getCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.frequency.value = 1200;
  gain.gain.setValueAtTime(0.05, start);
  gain.gain.exponentialRampToValueAtTime(0.001, start + 0.04);
  osc.start(start); osc.stop(start + 0.05);
}

const NOTE_FREQ = 523.25; // C5 for piano
const BPM = 72;
const BEAT_SEC = 60 / BPM;

// Play a rhythm pattern
// pattern: array of {type, beats, dotted, rest}
function playPattern(pattern) {
  const ctx = getCtx();
  let t = ctx.currentTime + 0.1;
  for (const note of pattern) {
    const dur = note.beats * BEAT_SEC * (note.dotted ? 1.5 : 1);
    if (note.rest) {
      playTick(t);
    } else {
      if (soundMode === 'piano') {
        playPianoNote(NOTE_FREQ, t, dur);
      } else {
        const syl = note.beats <= 0.5 ? 'ta' : note.beats <= 1 ? 'tan' : 'n';
        playVoiceNote(syl, t, dur);
      }
    }
    t += dur;
  }
}

// ===================================================
// NOTE DATA MODEL
// ===================================================
// beat values: 4=whole, 2=half, 1=quarter, 0.5=eighth, 0.25=sixteenth
// dotted=true means *1.5

const NOTE_DEFS = {
  whole:    { beats:4,    dotted:false, rest:false, label:'全音符' },
  half:     { beats:2,    dotted:false, rest:false, label:'二分音符' },
  quarter:  { beats:1,    dotted:false, rest:false, label:'四分音符' },
  eighth:   { beats:0.5,  dotted:false, rest:false, label:'八分音符' },
  sixteenth:{ beats:0.25, dotted:false, rest:false, label:'十六分音符' },
  dotHalf:  { beats:2,    dotted:true,  rest:false, label:'付点二分音符' },
  dotQuarter:{beats:1,    dotted:true,  rest:false, label:'付点四分音符' },
  dotEighth:{ beats:0.5,  dotted:true,  rest:false, label:'付点八分音符' },
  qRest:    { beats:1,    dotted:false, rest:true,  label:'四分休符' },
  eRest:    { beats:0.5,  dotted:false, rest:true,  label:'八分休符' },
  hRest:    { beats:2,    dotted:false, rest:true,  label:'二分休符' },
};

// ===================================================
// RHYTHM PATTERNS PER LEVEL
// ===================================================
// Each pattern is an array of note keys summing to 4 beats
const PATTERNS_LV1 = [
  ['quarter','quarter','quarter','quarter'],
  ['half','half'],
  ['whole'],
  ['half','quarter','quarter'],
  ['quarter','quarter','half'],
  ['quarter','half','quarter'],
];

const PATTERNS_LV2 = [
  ['quarter','eighth','eighth','quarter','quarter'],
  ['quarter','eighth','eighth','half'],             // 1+0.5+0.5+2=4
  ['eighth','eighth','eighth','eighth','quarter','quarter'],
  ['qRest','quarter','quarter','quarter'],
  ['quarter','qRest','eighth','eighth','quarter'],
  ['half','qRest','quarter'],
  ['qRest','qRest','quarter','quarter'],
  ['quarter','eighth','eighth','eighth','eighth','quarter'],
];

const PATTERNS_LV3 = [
  ['dotQuarter','eighth','dotQuarter','eighth'],    // 1.5+0.5+1.5+0.5=4
  ['dotQuarter','eighth','quarter','quarter'],       // 1.5+0.5+1+1=4
  ['quarter','eRest','eighth','quarter','quarter'],  // 1+0.5+0.5(wait).. adjusting below
  ['dotHalf','quarter'],                            // 3+1=4
  ['dotQuarter','eighth','dotQuarter','eighth'],
  ['sixteenth','sixteenth','eighth','quarter','half'],  // 0.25+0.25+0.5+1+2=4
  ['eighth','sixteenth','sixteenth','quarter','half'],
  ['dotQuarter','eighth','eRest','eighth','quarter'],
];

// Fix: recompute valid patterns
function patternBeats(keys) {
  return keys.reduce((s,k)=>{
    const d = NOTE_DEFS[k];
    return s + d.beats * (d.dotted?1.5:1);
  }, 0);
}

function getAllPatterns(lv) {
  const raw = lv===1 ? PATTERNS_LV1 : lv===2 ? PATTERNS_LV2 : PATTERNS_LV3;
  // filter valid (sum ~4)
  return raw.filter(p => Math.abs(patternBeats(p)-4) < 0.01);
}

// ===================================================
// SVG NOTATION RENDERER
// ===================================================
// Very simplified but recognizable music notation
const SVG_W = 560, SVG_H = 100;
const STAFF_TOP = 28, STAFF_GAP = 10, STAFF_LINES = 5;
const STAFF_BOTTOM = STAFF_TOP + STAFF_GAP * (STAFF_LINES-1); // 68
const NOTE_Y = STAFF_TOP + STAFF_GAP * 2; // middle line = B4
const STEM_H = 30;

function makeNoteSVG(keys) {
  let svg = `<svg viewBox="0 0 ${SVG_W} ${SVG_H}" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;min-width:320px;height:${SVG_H}px">`;

  // Staff lines
  for (let i=0;i<STAFF_LINES;i++) {
    const y = STAFF_TOP + i*STAFF_GAP;
    svg += `<line x1="20" y1="${y}" x2="${SVG_W-20}" y2="${y}" class="staff-line"/>`;
  }
  // Treble clef simplified
  svg += trebleClef(22, STAFF_TOP);

  // Bar line at end
  svg += `<line x1="${SVG_W-22}" y1="${STAFF_TOP}" x2="${SVG_W-22}" y2="${STAFF_BOTTOM}" class="bar-line"/>`;
  svg += `<line x1="52" y1="${STAFF_TOP}" x2="52" y2="${STAFF_BOTTOM}" stroke="#3a2f4e" stroke-width="2"/>`;

  // Time sig 4/4
  svg += `<text x="58" y="${STAFF_TOP+16}" font-size="18" font-weight="bold" fill="#3a2f4e" font-family="serif">4</text>`;
  svg += `<text x="58" y="${STAFF_TOP+34}" font-size="18" font-weight="bold" fill="#3a2f4e" font-family="serif">4</text>`;

  // Notes
  const startX = 90;
  const totalWidth = SVG_W - 22 - startX - 10;
  let x = startX;

  // layout: proportional to beats
  const notes = keys.map(k => NOTE_DEFS[k]);
  const total = notes.reduce((s,n)=>s+n.beats*(n.dotted?1.5:1),0);

  // collect eighth notes for beaming
  const positions = [];
  for (const note of notes) {
    const dur = note.beats * (note.dotted?1.5:1);
    const w = (dur/total) * totalWidth;
    positions.push({note, x: x + w/2, w});
    x += w;
  }

  // Draw beams for consecutive eighths
  const beamGroups = [];
  let gi = [];
  for (let i=0;i<positions.length;i++) {
    const {note} = positions[i];
    if ((note.beats===0.5||note.beats===0.25) && !note.rest && !note.dotted) {
      gi.push(i);
    } else {
      if (gi.length>=2) beamGroups.push([...gi]);
      gi = [];
    }
  }
  if (gi.length>=2) beamGroups.push([...gi]);
  const beamed = new Set(beamGroups.flat());

  // Draw beams first
  for (const grp of beamGroups) {
    const x1 = positions[grp[0]].x + 5;
    const x2 = positions[grp[grp.length-1]].x + 5;
    const y1 = NOTE_Y - STEM_H, y2 = NOTE_Y - STEM_H;
    svg += `<rect x="${x1-1}" y="${y1-4}" width="${x2-x1+2}" height="5" class="beam"/>`;
    // If any sixteenth
    if (positions[grp[0]].note.beats===0.25) {
      svg += `<rect x="${x1-1}" y="${y1-10}" width="${x2-x1+2}" height="5" class="beam"/>`;
    }
    // stems
    for (const i of grp) {
      const px = positions[i].x + 5;
      svg += `<line x1="${px}" y1="${NOTE_Y}" x2="${px}" y2="${y1}" class="note-stem"/>`;
    }
  }

  // Draw each note
  for (let i=0;i<positions.length;i++) {
    const {note, x:nx} = positions[i];
    svg += drawNote(note, nx, NOTE_Y, beamed.has(i));
  }

  svg += '</svg>';
  return svg;
}

function drawNote(note, x, y, beamed) {
  let s = '';
  if (note.rest) {
    s += drawRest(note, x, y);
  } else if (note.beats===4) {
    // Whole note: open oval
    s += `<ellipse cx="${x}" cy="${y}" rx="9" ry="6.5" fill="none" stroke="#3a2f4e" stroke-width="2.5" class="note-head"/>`;
  } else if (note.beats===2) {
    // Half note: open oval + stem
    s += `<ellipse cx="${x}" cy="${y}" rx="7.5" ry="5.5" fill="none" stroke="#3a2f4e" stroke-width="2.2" class="note-head"/>`;
    s += `<line x1="${x+7}" y1="${y}" x2="${x+7}" y2="${y-STEM_H}" class="note-stem"/>`;
    if (note.dotted) s += `<circle cx="${x+16}" cy="${y}" r="2.5" class="dot"/>`;
  } else if (note.beats===1) {
    // Quarter: filled + stem
    s += `<ellipse cx="${x}" cy="${y}" rx="7" ry="5.5" fill="#3a2f4e" transform="rotate(-20,${x},${y})" class="note-head"/>`;
    s += `<line x1="${x+6}" y1="${y}" x2="${x+6}" y2="${y-STEM_H}" class="note-stem"/>`;
    if (note.dotted) s += `<circle cx="${x+16}" cy="${y}" r="2.5" class="dot"/>`;
  } else {
    // Eighth / sixteenth: filled, stem, flag (unless beamed)
    s += `<ellipse cx="${x}" cy="${y}" rx="6.5" ry="5" fill="#3a2f4e" transform="rotate(-20,${x},${y})" class="note-head"/>`;
    if (!beamed) {
      s += `<line x1="${x+5}" y1="${y}" x2="${x+5}" y2="${y-STEM_H}" class="note-stem"/>`;
      // flag
      s += `<path d="M${x+5},${y-STEM_H} Q${x+22},${y-STEM_H+12} ${x+5},${y-STEM_H+22}" class="note-flag"/>`;
      if (note.beats===0.25) {
        s += `<path d="M${x+5},${y-STEM_H+8} Q${x+22},${y-STEM_H+20} ${x+5},${y-STEM_H+30}" class="note-flag"/>`;
      }
    }
    if (note.dotted) s += `<circle cx="${x+14}" cy="${y}" r="2.5" class="dot"/>`;
  }
  return s;
}

function drawRest(note, x, y) {
  const beats = note.beats;
  if (beats===4) {
    return `<rect x="${x-10}" y="${y-6}" width="20" height="10" class="rest-fill"/>`;
  } else if (beats===2) {
    return `<rect x="${x-10}" y="${y}" width="18" height="8" class="rest-fill"/>`;
  } else if (beats===1) {
    // Quarter rest: squiggle simplified
    return `<path d="M${x-4},${y-14} L${x+5},${y-8} L${x-4},${y-2} L${x+6},${y+8}" fill="none" stroke="#3a2f4e" stroke-width="2.5" stroke-linecap="round"/>`;
  } else if (beats===0.5) {
    return `<path d="M${x},${y-10} L${x+8},${y-4} L${x},${y+2}" fill="none" stroke="#3a2f4e" stroke-width="2.5" stroke-linecap="round"/>`;
  }
  return '';
}

function trebleClef(x, y) {
  // Simplified treble clef as path
  return `<text x="${x}" y="${y+44}" font-size="56" font-family="serif" fill="#bbb" opacity=".7">&amp;#119070;</text>`;
}

// ===================================================
// GAME STATE
// ===================================================
const UNLOCK_SCORE = 10;
let state = {
  level: 1,
  unlocked: [1],
  levelScores: {1:0,2:0,3:0},
  score: 0,
  correct: 0,
  qNum: 0,
  currentPattern: null,
  choices: [],
  answered: false,
};

function saveState() {
  localStorage.setItem('rhythm_game', JSON.stringify({
    unlocked: state.unlocked,
    levelScores: state.levelScores,
  }));
}
function loadState() {
  try {
    const d = JSON.parse(localStorage.getItem('rhythm_game')||'{}');
    if (d.unlocked) state.unlocked = d.unlocked;
    if (d.levelScores) state.levelScores = d.levelScores;
  } catch(e){}
}

// ===================================================
// TOP SCREEN
// ===================================================
const LEVEL_INFO = [
  {n:1, name:'はじめて', desc:'全・二分・四分音符'},
  {n:2, name:'なれてきた', desc:'八分音符・休符'},
  {n:3, name:'チャレンジ', desc:'付点・十六分音符'},
];

function renderTop() {
  const wrap = document.getElementById('level-cards');
  wrap.innerHTML = '';
  for (const lv of LEVEL_INFO) {
    const locked = !state.unlocked.includes(lv.n);
    const best = state.levelScores[lv.n] || 0;
    const stars = '★'.repeat(Math.min(3,Math.ceil(best/4))) + '☆'.repeat(3-Math.min(3,Math.ceil(best/4)));
    wrap.innerHTML += `
      <div class="level-card${locked?' locked':''}" onclick="${locked?'':'startGame('+lv.n+')'}">
        <div class="lv-num">Lv.${lv.n}</div>
        <div style="font-weight:700;margin:4px 0">${lv.name}</div>
        <div class="lv-name">${lv.desc}</div>
        <div class="lv-stars">${locked?'🔒':stars}</div>
        ${locked?'<div style="font-size:.75rem;color:#aaa;margin-top:4px">まえのレベルを10もんクリア！</div>':''}
      </div>`;
  }
}

// ===================================================
// GAME
// ===================================================
function startGame(lv) {
  state.level = lv;
  state.score = 0;
  state.correct = 0;
  state.qNum = 0;
  showScreen('screen-game');
  nextQuestion();
}

function nextQuestion() {
  state.answered = false;
  state.qNum++;
  updateHUD();

  const patterns = getAllPatterns(state.level);
  // pick question
  const qi = Math.floor(Math.random() * patterns.length);
  state.currentPattern = patterns[qi];

  // generate 3 distractors
  const distractors = [];
  const used = new Set([qi]);
  while (distractors.length < 3) {
    const di = Math.floor(Math.random() * patterns.length);
    if (!used.has(di)) { used.add(di); distractors.push(patterns[di]); }
  }
  state.choices = shuffle([state.currentPattern, ...distractors]);

  // render question
  document.getElementById('question-svg').innerHTML = makeNoteSVG(state.currentPattern);
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').textContent = '';

  renderChoices();
  enablePlayBtn(true);
}

function renderChoices() {
  const wrap = document.getElementById('choices');
  wrap.innerHTML = '';
  state.choices.forEach((pattern, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = makeNoteSVG(pattern);
    btn.onclick = () => answer(i);
    wrap.appendChild(btn);
  });
}

function answer(i) {
  if (state.answered) return;
  state.answered = true;
  enablePlayBtn(false);

  const correct = state.choices[i] === state.currentPattern;
  const btns = document.querySelectorAll('.choice-btn');
  btns.forEach(b=>b.disabled=true);

  if (correct) {
    btns[i].classList.add('correct');
    state.correct++;
    state.score += 100;
    showFeedback('⭕ せいかい！', true);
    playPianoNote(660, getCtx().currentTime+0.05, 0.3);
    playPianoNote(784, getCtx().currentTime+0.15, 0.4);
  } else {
    btns[i].classList.add('wrong');
    // highlight correct
    state.choices.forEach((p,j)=>{ if(p===state.currentPattern) btns[j].classList.add('correct'); });
    showFeedback('❌ ざんねん…', false);
    playPianoNote(200, getCtx().currentTime+0.05, 0.5);
  }

  updateHUD();

  setTimeout(()=>{
    if (state.correct >= UNLOCK_SCORE) {
      endGame(true);
    } else if (state.qNum >= 20) {
      endGame(false);
    } else {
      nextQuestion();
    }
  }, 1500);
}

function showFeedback(msg, ok) {
  const el = document.getElementById('feedback');
  el.textContent = msg;
  el.className = 'feedback show ' + (ok?'ok':'ng');
}

function updateHUD() {
  document.getElementById('hud-level').textContent = `レベル${state.level}`;
  document.getElementById('hud-correct').textContent = `✅ ${state.correct} / 10`;
  document.getElementById('hud-score').textContent = `スコア: ${state.score}`;
  document.getElementById('progress-bar').style.width = (state.correct/10*100)+'%';
}

function playQuestion() {
  playPattern(state.currentPattern.map(k=>NOTE_DEFS[k]));
}

function enablePlayBtn(en) {
  document.getElementById('play-btn').disabled = !en;
}

// ===================================================
// END GAME
// ===================================================
function endGame(cleared) {
  // update level score
  if (state.correct > (state.levelScores[state.level]||0)) {
    state.levelScores[state.level] = state.correct;
  }

  // unlock next
  const nextLv = state.level + 1;
  if (cleared && nextLv <= 3 && !state.unlocked.includes(nextLv)) {
    state.unlocked.push(nextLv);
    saveState();
    // show levelup banner
    if (nextLv <= 3) {
      document.getElementById('levelup-text').textContent = `レベル${nextLv}がかいじょされた！`;
      document.getElementById('levelup-banner').classList.add('show');
      launchConfetti();
      return;
    }
  }
  saveState();
  showResult(cleared);
}

function dismissLevelup() {
  document.getElementById('levelup-banner').classList.remove('show');
  showResult(true);
}

function showResult(cleared) {
  showScreen('screen-result');
  document.getElementById('result-title').textContent = cleared ? '🎉 クリア！' : 'おわり！';
  document.getElementById('result-score-text').textContent = `${state.correct} / ${UNLOCK_SCORE} もんせいかい`;
  const msgs = ['もう1かいちょうせん！', 'がんばったね！', 'すごい！', 'かんぺき！'];
  document.getElementById('result-msg').textContent = msgs[Math.min(3,Math.floor(state.correct/3))];

  const nextBtn = document.getElementById('result-next-btn');
  const nextLv = state.level + 1;
  if (cleared && nextLv <= 3) {
    nextBtn.style.display = '';
    nextBtn.textContent = `レベル${nextLv}へ →`;
    nextBtn.onclick = () => startGame(nextLv);
  } else if (cleared && nextLv > 3) {
    nextBtn.style.display = '';
    nextBtn.textContent = '🏆 ぜんぶクリア！';
    nextBtn.onclick = goTop;
    launchConfetti();
  } else {
    nextBtn.style.display = '';
    nextBtn.textContent = 'もう1かい';
    nextBtn.onclick = () => startGame(state.level);
  }
}

function goTop() {
  renderTop();
  showScreen('screen-top');
}

// ===================================================
// UTILS
// ===================================================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function shuffle(arr) {
  for (let i=arr.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

// ===================================================
// CONFETTI
// ===================================================
function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const particles = Array.from({length:120},()=>({
    x: Math.random()*canvas.width,
    y: -20,
    vx: (Math.random()-.5)*4,
    vy: Math.random()*4+2,
    color: ['#ff6b9d','#ffd93d','#6bcb77','#4d96ff','#ff6b6b'][Math.floor(Math.random()*5)],
    r: Math.random()*6+4,
    rot: Math.random()*360,
    rv: (Math.random()-.5)*8,
  }));
  let frame;
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive = false;
    for (const p of particles) {
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.rv;
      if (p.y<canvas.height+20) alive=true;
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.color;
      ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r);
      ctx.restore();
    }
    if (alive) frame=requestAnimationFrame(draw);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  cancelAnimationFrame(frame);
  draw();
  setTimeout(()=>{ cancelAnimationFrame(frame); ctx.clearRect(0,0,canvas.width,canvas.height); },4000);
}

// ===================================================
// INIT
// ===================================================
loadState();
renderTop();
</script>
