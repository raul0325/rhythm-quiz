<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>リズムあそび ♪</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap');

  :root {
    --bg: #fff0f7;
    --primary: #ff5fa0;
    --secondary: #ffda45;
    --accent: #5dcb6e;
    --accent2: #4d96ff;
    --text: #3a2255;
    --card: #ffffff;
    --shadow: 0 6px 24px rgba(255,95,160,0.18);
    --shadow-sm: 0 3px 12px rgba(255,95,160,0.12);
    --radius: 24px;
    --radius-sm: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'BIZ UDPGothic', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 16px 12px 40px;
    background-image:
      radial-gradient(ellipse at 10% 10%, #ffcde8 0%, transparent 40%),
      radial-gradient(ellipse at 90% 85%, #c8e8ff 0%, transparent 40%),
      radial-gradient(ellipse at 60% 40%, #fff3c8 0%, transparent 35%);
  }

  h1 {
    font-weight: 900;
    font-size: clamp(2rem, 6vw, 3rem);
    color: var(--primary);
    text-shadow: 0 4px 0 #ffc5de, 2px 2px 0 #ffaed3;
    margin: 8px 0 2px;
    letter-spacing: 2px;
  }

  .screen { display: none; width: 100%; max-width: 680px; animation: fadeIn .3s ease; }
  .screen.active { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }

  /* ===== TOP ===== */
  .mascot { font-size: 5rem; animation: bounce 2s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

  .level-cards { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .level-card {
    background: linear-gradient(145deg, #fff 0%, #fff5fa 100%);
    border-radius: var(--radius); padding: 22px 28px;
    text-align: center; cursor: pointer;
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.9);
    border: 3px solid #ffdaec; transition: all .25s; min-width: 160px;
  }
  .level-card:hover  { transform: translateY(-6px) scale(1.02); border-color: var(--primary); box-shadow: 0 10px 32px rgba(255,95,160,.28); }
  .level-card:active { transform: translateY(-2px) scale(.99); }
  .level-card.locked { opacity: .4; cursor: not-allowed; }
  .level-card .lv-num  { font-weight: 900; font-size: 2.2rem; color: var(--primary); }
  .level-card .lv-name { font-weight: 700; margin: 4px 0; }
  .level-card .lv-sub  { font-size: .78rem; color: #bb88aa; margin-top: 4px; }
  .level-card .lv-stars { font-size: 1.2rem; margin-top: 8px; }

  /* ===== HUD ===== */
  .hud {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%;
    background: linear-gradient(135deg, #fff 0%, #fff5fa 100%);
    border-radius: var(--radius-sm); padding: 12px 20px;
    box-shadow: var(--shadow-sm); border: 2px solid #ffdaec;
  }
  .hud-level   { font-weight: 900; font-size: 1rem; color: var(--primary); }
  .hud-correct { font-size: .9rem; color: var(--accent); font-weight: 700; }
  .hud-score   { font-size: .9rem; }

  .progress-bar-wrap { width: 100%; height: 12px; background: #ffd6ea; border-radius: 99px; overflow: hidden; }
  .progress-bar { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); border-radius: 99px; transition: width .4s ease; }

  /* ===== LISTEN CARD ===== */
  .listen-card {
    background: linear-gradient(160deg, #fff5fa 0%, #f0f8ff 100%);
    border-radius: var(--radius); padding: 36px 24px;
    box-shadow: var(--shadow); width: 100%; text-align: center;
    border: 2px solid #ffdaec; position: relative; overflow: hidden;
  }
  .listen-card::before {
    content: '🎵'; font-size: 6rem; opacity: .06;
    position: absolute; top: -10px; right: -10px; transform: rotate(20deg);
  }
  .listen-label { font-size: 1rem; color: #cc88bb; font-weight: 700; margin-bottom: 18px; }

  .play-btn {
    background: linear-gradient(135deg, #ff7ab8 0%, var(--primary) 50%, #e04585 100%);
    color: #fff; border: none; border-radius: 50px;
    padding: 18px 52px; font-size: 1.25rem;
    font-family: inherit; font-weight: 800;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(255,95,160,.45), 0 2px 0 #c43577;
    transition: all .2s; display: inline-flex; align-items: center; gap: 10px;
    letter-spacing: .5px;
  }
  .play-btn:hover  { transform: scale(1.07) translateY(-2px); box-shadow: 0 10px 28px rgba(255,95,160,.55), 0 2px 0 #c43577; }
  .play-btn:active { transform: scale(.97) translateY(1px); }
  .play-btn.playing { background: linear-gradient(135deg,#aaa,#888); box-shadow: none; cursor: default; }
  .play-count { font-size: .8rem; color: #cca0bb; margin-top: 10px; min-height: 1.2em; }

  /* ===== CHOICES ===== */
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
  .choice-btn {
    background: linear-gradient(160deg, #fff 0%, #fdf5ff 100%);
    border: 3px solid #eed8f8; border-radius: var(--radius);
    padding: 12px 8px; cursor: pointer; transition: all .22s;
    display: flex; flex-direction: row; align-items: center; justify-content: center;
    flex-wrap: wrap; gap: 2px;
    box-shadow: 0 3px 12px rgba(180,100,220,.1), inset 0 1px 0 rgba(255,255,255,.8);
    min-height: 72px;
  }
  .choice-btn:hover:not(:disabled) {
    border-color: var(--primary); transform: translateY(-4px) scale(1.02);
    box-shadow: 0 8px 20px rgba(255,95,160,.2);
    background: linear-gradient(160deg, #fff5fa 0%, #ffeeff 100%);
  }
  .choice-btn.correct { border-color: var(--accent); background: linear-gradient(160deg,#f0fff4,#e0ffe8); animation: pop .3s ease; box-shadow: 0 4px 16px rgba(93,203,110,.25); }
  .choice-btn.wrong   { border-color: #ff7070; background: linear-gradient(160deg,#fff5f5,#ffe0e0); animation: shake .3s ease; }
  .choice-btn:disabled { cursor: default; }

  .choice-btn img {
    height: 44px;
    width: auto;
    object-fit: contain;
    display: block;
  }

  @keyframes pop   { 0%{transform:scale(1)} 50%{transform:scale(1.06)} 100%{transform:scale(1)} }
  @keyframes shake { 0%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} 100%{transform:translateX(0)} }

  /* ===== FEEDBACK ===== */
  .feedback { font-size: 1.4rem; font-weight: 900; padding: 12px 32px; border-radius: 50px; display: none; }
  .feedback.show { display: block; animation: fadeIn .2s ease; }
  .feedback.ok { background: linear-gradient(135deg,#d4fde2,#b8f5c8); color: #1a7a35; box-shadow: 0 4px 16px rgba(93,203,110,.3); }
  .feedback.ng { background: linear-gradient(135deg,#ffe0e0,#ffc8c8); color: #c03030; box-shadow: 0 4px 16px rgba(255,100,100,.2); }

  /* ===== RESULT ===== */
  .result-card {
    background: linear-gradient(160deg, #fff5fa 0%, #f5f0ff 100%);
    border-radius: var(--radius); padding: 36px 24px;
    text-align: center; box-shadow: var(--shadow); width: 100%;
    border: 2px solid #ffdaec;
  }
  .result-card h2 { font-weight: 900; font-size: 2rem; color: var(--primary); }
  .result-score   { font-size: 3rem; font-weight: 900; color: var(--accent2); margin: 12px 0; }

  /* ===== BUTTONS ===== */
  .btn {
    border: none; border-radius: 50px; padding: 13px 34px;
    font-family: inherit; font-size: 1rem; font-weight: 800;
    cursor: pointer; transition: all .22s; letter-spacing: .3px;
  }
  .btn-primary {
    background: linear-gradient(135deg, #ff7ab8, var(--primary), #e04585);
    color: #fff;
    box-shadow: 0 5px 16px rgba(255,95,160,.42), 0 2px 0 #b83070;
  }
  .btn-primary:hover  { transform: translateY(-3px); box-shadow: 0 8px 22px rgba(255,95,160,.52); }
  .btn-primary:active { transform: translateY(0); }
  .btn-secondary { background: #f5eef8; color: #997; border: 2px solid #e8daf0; }
  .btn-secondary:hover { background: #ede0f5; }
  .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  /* back btn */
  .back-btn {
    align-self: flex-start;
    background: none; border: 2px solid #e8d0f0; border-radius: 50px;
    padding: 8px 20px; font-family: inherit; font-size: .9rem;
    font-weight: 700; color: #bb88cc; cursor: pointer; transition: all .2s;
    display: flex; align-items: center; gap: 6px;
  }
  .back-btn:hover { background: #fff0ff; border-color: var(--primary); color: var(--primary); }

  /* ===== LEVELUP ===== */
  #levelup-banner { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 100; align-items: center; justify-content: center; }
  #levelup-banner.show { display: flex; animation: fadeIn .3s; }
  .levelup-box {
    background: linear-gradient(160deg, #fff5fa, #f5f0ff);
    border-radius: 30px; padding: 44px 40px; text-align: center;
    box-shadow: 0 20px 60px rgba(255,95,160,.35); border: 3px solid #ffdaec;
  }
  .levelup-box h2 { font-weight: 900; font-size: 2.5rem; color: var(--primary); }

  #confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 99; }
</style>
</head>
<body>
<canvas id="confetti-canvas"></canvas>

<!-- ===== TOP ===== -->
<div id="screen-top" class="screen active">
  <div class="mascot">🎵</div>
  <h1>リズムあそび</h1>
  <p style="color:#cc99bb;font-size:.95rem;font-weight:700;">音を聴いてリズムをあてよう！</p>
  <div class="level-cards" id="level-cards"></div>
  <p style="color:#dbb;font-size:.8rem;margin-top:4px;">10もんせいかいでレベルアップ！</p>
</div>

<!-- ===== GAME ===== -->
<div id="screen-game" class="screen">
  <button class="back-btn" onclick="confirmBack()">← もどる</button>
  <h1 style="font-size:1.6rem">リズムあそび</h1>

  <div class="hud">
    <span class="hud-level"  id="hud-level">レベル1</span>
    <span class="hud-correct" id="hud-correct">✅ 0 / 10</span>
    <span class="hud-score"  id="hud-score">スコア: 0</span>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progress-bar" style="width:0%"></div>
  </div>

  <div class="listen-card">
    <div class="listen-label">👂 リズムを聴いてね</div>
    <button class="play-btn" id="play-btn" onclick="playQuestion()">▶ きく</button>
    <div class="play-count" id="play-count"></div>
  </div>

  <div class="feedback" id="feedback"></div>
  <div class="choices"  id="choices"></div>
</div>

<!-- ===== RESULT ===== -->
<div id="screen-result" class="screen">
  <div class="result-card">
    <div class="mascot" style="font-size:3.5rem">🎊</div>
    <h2 id="result-title">クリア！</h2>
    <div class="result-score" id="result-score-text"></div>
    <p style="color:#888;margin-bottom:20px" id="result-msg"></p>
    <div class="btn-row">
      <button class="btn btn-primary"   id="result-next-btn"></button>
      <button class="btn btn-secondary" onclick="goTop()">トップにもどる</button>
    </div>
  </div>
</div>

<!-- ===== LEVELUP ===== -->
<div id="levelup-banner">
  <div class="levelup-box">
    <div style="font-size:4rem;margin-bottom:12px">🌟</div>
    <h2>レベルアップ！</h2>
    <p id="levelup-text" style="margin:12px 0;color:#888;font-weight:700;"></p>
    <button class="btn btn-primary" onclick="dismissLevelup()">つぎへ！</button>
  </div>
</div>

<script>
// =============================================
// 画像マップ
// =============================================
const IMG = {
  whole:        'images/whole.jpg',
  half:         'images/half.jpg',
  dot_half:     'images/dot_half.jpg',
  quarter:      'images/quarter.jpg',
  dot_quarter:  'images/dot_quarter.jpg',
  eighth:       'images/eighth.jpg',
  dot_eighth:   'images/dot_eighth.jpg',
  sixteenth:    'images/sixteenth.jpg',
  rest_half:    'images/rest_half.jpg',
  rest_quarter: 'images/rest_quarter.jpg',
  rest_eighth:  'images/rest_eighth.jpg',
};

// =============================================
// 音符定義
// =============================================
const ND = {
  whole:       { beats:4,    dotted:false, rest:false, img:'whole',        label:'全音符' },
  half:        { beats:2,    dotted:false, rest:false, img:'half',         label:'二分音符' },
  dot_half:    { beats:2,    dotted:true,  rest:false, img:'dot_half',     label:'付点二分音符' },
  quarter:     { beats:1,    dotted:false, rest:false, img:'quarter',      label:'四分音符' },
  dot_quarter: { beats:1,    dotted:true,  rest:false, img:'dot_quarter',  label:'付点四分音符' },
  eighth:      { beats:0.5,  dotted:false, rest:false, img:'eighth',       label:'八分音符' },
  dot_eighth:  { beats:0.5,  dotted:true,  rest:false, img:'dot_eighth',   label:'付点八分音符' },
  sixteenth:   { beats:0.25, dotted:false, rest:false, img:'sixteenth',    label:'十六分音符' },
  rest_half:   { beats:2,    dotted:false, rest:true,  img:'rest_half',    label:'二分休符' },
  rest_quarter:{ beats:1,    dotted:false, rest:true,  img:'rest_quarter', label:'四分休符' },
  rest_eighth: { beats:0.5,  dotted:false, rest:true,  img:'rest_eighth',  label:'八分休符' },
};

function totalBeats(keys) {
  return keys.reduce((s,k) => {
    const d = ND[k]; return s + d.beats * (d.dotted ? 1.5 : 1);
  }, 0);
}

// =============================================
// パターン
// =============================================
const P1 = [
  ['quarter','quarter','quarter','quarter'],
  ['rest_quarter','quarter','quarter','quarter'],
  ['quarter','rest_quarter','quarter','quarter'],
  ['quarter','quarter','rest_quarter','quarter'],
  ['quarter','quarter','quarter','rest_quarter'],
  ['half','quarter','quarter'],
  ['quarter','quarter','half'],
  ['half','rest_quarter','quarter'],
  ['half','quarter','rest_quarter'],
  ['dot_quarter','eighth','quarter','quarter'],
  ['quarter','dot_quarter','eighth','quarter'],
  ['quarter','quarter','dot_quarter','eighth'],
  ['dot_quarter','eighth','dot_quarter','eighth'],
  ['eighth','eighth','quarter','quarter','quarter'],
  ['quarter','eighth','eighth','quarter','quarter'],
  ['eighth','eighth','eighth','eighth','half'],
  ['eighth','eighth','eighth','eighth','quarter','quarter'],
  ['rest_quarter','eighth','eighth','quarter','quarter'],
  ['eighth','eighth','rest_quarter','quarter','quarter'],
  ['quarter','rest_quarter','eighth','eighth','quarter'],
];

const P2 = [
  ['sixteenth','sixteenth','eighth','quarter','half'],
  ['eighth','sixteenth','sixteenth','quarter','half'],
  ['sixteenth','sixteenth','sixteenth','sixteenth','quarter','half'],
  ['rest_quarter','quarter','quarter','quarter'],
  ['quarter','rest_quarter','quarter','quarter'],
  ['dot_quarter','eighth','rest_quarter','quarter'],
  ['rest_eighth','eighth','quarter','quarter','quarter'],
  ['eighth','rest_eighth','eighth','rest_eighth','quarter','quarter'],
  ['dot_quarter','eighth','sixteenth','sixteenth','eighth','quarter'],
  ['sixteenth','sixteenth','eighth','dot_quarter','eighth','quarter'],
  ['rest_half','quarter','quarter'],
  ['quarter','rest_half','quarter'],
  ['rest_quarter','dot_quarter','eighth','quarter'],
  ['eighth','eighth','sixteenth','sixteenth','eighth','half'],
];

const P3 = [
  ['dot_eighth','sixteenth','dot_eighth','sixteenth','half'],
  ['dot_eighth','sixteenth','quarter','dot_quarter','eighth'],
  ['sixteenth','sixteenth','sixteenth','sixteenth','sixteenth','sixteenth','sixteenth','sixteenth','half'],
  ['dot_quarter','eighth','dot_eighth','sixteenth','quarter'],
  ['rest_eighth','eighth','rest_eighth','eighth','dot_quarter','eighth'],
  ['sixteenth','sixteenth','eighth','dot_eighth','sixteenth','quarter','quarter'],
  ['dot_eighth','sixteenth','dot_eighth','sixteenth','dot_quarter','eighth'],
  ['quarter','sixteenth','sixteenth','sixteenth','sixteenth','dot_quarter','eighth'],
  ['dot_half','rest_eighth','eighth'],
  ['sixteenth','sixteenth','sixteenth','sixteenth','dot_quarter','eighth','quarter'],
  ['dot_eighth','sixteenth','eighth','eighth','dot_quarter','eighth'],
  ['rest_eighth','sixteenth','sixteenth','dot_eighth','sixteenth','quarter','quarter'],
];

function getPatterns(lv) {
  const raw = lv===1 ? P1 : lv===2 ? P2 : P3;
  return raw.filter(p => Math.abs(totalBeats(p) - 4) < 0.02);
}

// =============================================
// 音声エンジン
// =============================================
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function getCtx() { if (!audioCtx) audioCtx = new AudioCtx(); return audioCtx; }

const BPM = 76;
const BEAT = 60 / BPM;
const FREQ = 523.25;

function playPiano(freq, start, dur) {
  const ctx = getCtx();
  const osc = ctx.createOscillator();
  const g   = ctx.createGain();
  osc.connect(g); g.connect(ctx.destination);
  osc.type = 'triangle';
  osc.frequency.value = freq;
  g.gain.setValueAtTime(0, start);
  g.gain.linearRampToValueAtTime(0.32, start + 0.015);
  g.gain.exponentialRampToValueAtTime(0.001, start + Math.max(dur * 0.85, 0.05));
  osc.start(start); osc.stop(start + dur + 0.05);
}

function playRestTick(start) {
  const ctx = getCtx();
  const osc = ctx.createOscillator();
  const g   = ctx.createGain();
  osc.connect(g); g.connect(ctx.destination);
  osc.frequency.value = 1400;
  g.gain.setValueAtTime(0.04, start);
  g.gain.exponentialRampToValueAtTime(0.001, start + 0.035);
  osc.start(start); osc.stop(start + 0.04);
}

let playingTimeout = null;

function playPattern(pattern, onDone) {
  const ctx = getCtx();
  let t = ctx.currentTime + 0.12;
  for (const n of pattern) {
    const dur = n.beats * BEAT * (n.dotted ? 1.5 : 1);
    if (n.rest) playRestTick(t);
    else        playPiano(FREQ, t, dur);
    t += dur;
  }
  if (onDone) {
    const total = pattern.reduce((s,n) => s + n.beats * BEAT * (n.dotted?1.5:1), 0);
    playingTimeout = setTimeout(onDone, (total + 0.3) * 1000);
  }
}

// =============================================
// ゲーム状態
// =============================================
const CLEAR_COUNT = 10;
let state = {
  level: 1, unlocked: [1], levelScores: {1:0,2:0,3:0},
  score: 0, correct: 0, qNum: 0,
  currentPattern: null, choices: [], answered: false, playCount: 0,
};

function save() {
  localStorage.setItem('rg3', JSON.stringify({ unlocked: state.unlocked, levelScores: state.levelScores }));
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem('rg3') || '{}');
    if (d.unlocked)     state.unlocked     = d.unlocked;
    if (d.levelScores)  state.levelScores  = d.levelScores;
  } catch(e) {}
}

// =============================================
// トップ画面
// =============================================
const LV_INFO = [
  { n:1, name:'はじめよう', sub:'四分・八分・付点・休符' },
  { n:2, name:'なれてきた', sub:'十六分・休符いろいろ' },
  { n:3, name:'チャレンジ', sub:'付点十六分・複合リズム' },
];

function renderTop() {
  const wrap = document.getElementById('level-cards');
  wrap.innerHTML = '';
  for (const lv of LV_INFO) {
    const locked = !state.unlocked.includes(lv.n);
    const best   = state.levelScores[lv.n] || 0;
    const filled = Math.min(3, Math.ceil(best / 4));
    const stars  = '★'.repeat(filled) + '☆'.repeat(3 - filled);
    wrap.innerHTML += `
      <div class="level-card${locked?' locked':''}" onclick="${locked ? '' : 'startGame('+lv.n+')'}">
        <div class="lv-num">Lv.${lv.n}</div>
        <div class="lv-name">${lv.name}</div>
        <div class="lv-sub">${lv.sub}</div>
        <div class="lv-stars">${locked ? '🔒' : stars}</div>
        ${locked ? '<div style="font-size:.72rem;color:#cca;margin-top:4px">まえのレベルを10もんクリア！</div>' : ''}
      </div>`;
  }
}

// =============================================
// ゲーム
// =============================================
function startGame(lv) {
  state.level = lv; state.score = 0; state.correct = 0;
  state.qNum = 0; state.answered = false;
  showScreen('screen-game');
  nextQuestion();
}

function nextQuestion() {
  state.answered = false;
  state.playCount = 0;
  state.qNum++;
  updateHUD();
  document.getElementById('play-count').textContent = '';
  document.getElementById('feedback').className = 'feedback';

  const pats = getPatterns(state.level);
  const qi   = Math.floor(Math.random() * pats.length);
  state.currentPattern = pats[qi];

  const used = new Set([qi]);
  const dist = [];
  let tries = 0;
  while (dist.length < 3 && tries < 200) {
    tries++;
    const di = Math.floor(Math.random() * pats.length);
    if (!used.has(di)) { used.add(di); dist.push(pats[di]); }
  }
  state.choices = shuffle([state.currentPattern, ...dist]);

  renderChoices();
  setPlayBtnState(false);
  setTimeout(() => playQuestion(), 400);
}

// パターンを画像の列で表示
function patternToImgs(keys) {
  return keys.map(k => {
    const d = ND[k];
    return `<img src="${IMG[d.img]}" alt="${d.label}" title="${d.label}">`;
  }).join('');
}

function renderChoices() {
  const wrap = document.getElementById('choices');
  wrap.innerHTML = '';
  state.choices.forEach((pat, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = patternToImgs(pat);
    btn.onclick = () => answer(i);
    wrap.appendChild(btn);
  });
}

function playQuestion() {
  if (state.answered) return;
  state.playCount++;
  setPlayBtnState(true);
  document.getElementById('play-count').textContent =
    state.playCount > 1 ? `（${state.playCount}かいめ）` : '';
  playPattern(state.currentPattern.map(k => ND[k]), () => setPlayBtnState(false));
}

function setPlayBtnState(playing) {
  const btn = document.getElementById('play-btn');
  btn.textContent = playing ? '♪ さいせいちゅう…' : '▶ きく';
  btn.classList.toggle('playing', playing);
  btn.disabled = playing;
}

function answer(idx) {
  if (state.answered) return;
  state.answered = true;
  clearTimeout(playingTimeout);
  setPlayBtnState(false);
  document.getElementById('play-btn').disabled = true;

  const correct = state.choices[idx] === state.currentPattern;
  const btns = document.querySelectorAll('.choice-btn');
  btns.forEach(b => b.disabled = true);

  if (correct) {
    btns[idx].classList.add('correct');
    state.correct++; state.score += 100;
    showFeedback('⭕ せいかい！', true);
    const ctx = getCtx(), t = ctx.currentTime + 0.05;
    playPiano(660, t, 0.25); playPiano(784, t+0.12, 0.3); playPiano(1047, t+0.24, 0.4);
  } else {
    btns[idx].classList.add('wrong');
    state.choices.forEach((p,j) => { if (p === state.currentPattern) btns[j].classList.add('correct'); });
    showFeedback('❌ ざんねん…', false);
    playPiano(180, getCtx().currentTime + 0.05, 0.5);
  }

  updateHUD();
  setTimeout(() => {
    if      (state.correct >= CLEAR_COUNT) endGame(true);
    else if (state.qNum >= 25)             endGame(false);
    else                                   nextQuestion();
  }, 1600);
}

function showFeedback(msg, ok) {
  const el = document.getElementById('feedback');
  el.textContent = msg;
  el.className = 'feedback show ' + (ok ? 'ok' : 'ng');
}

function updateHUD() {
  document.getElementById('hud-level').textContent   = `レベル${state.level}`;
  document.getElementById('hud-correct').textContent = `✅ ${state.correct} / 10`;
  document.getElementById('hud-score').textContent   = `スコア: ${state.score}`;
  document.getElementById('progress-bar').style.width = (state.correct / CLEAR_COUNT * 100) + '%';
}

function confirmBack() {
  if (state.answered || state.qNum === 0 ||
      confirm('とちゅうでやめる？\nせいかいすうはリセットされるよ。')) {
    goTop();
  }
}

// =============================================
// エンドゲーム
// =============================================
function endGame(cleared) {
  if (state.correct > (state.levelScores[state.level] || 0))
    state.levelScores[state.level] = state.correct;

  const nextLv = state.level + 1;
  if (cleared && nextLv <= 3 && !state.unlocked.includes(nextLv)) {
    state.unlocked.push(nextLv);
    save();
    document.getElementById('levelup-text').textContent = `レベル${nextLv}がかいじょされた！`;
    document.getElementById('levelup-banner').classList.add('show');
    launchConfetti();
    return;
  }
  save();
  showResult(cleared);
}

function dismissLevelup() {
  document.getElementById('levelup-banner').classList.remove('show');
  showResult(true);
}

function showResult(cleared) {
  showScreen('screen-result');
  document.getElementById('result-title').textContent    = cleared ? '🎉 クリア！' : 'おわり！';
  document.getElementById('result-score-text').textContent = `${state.correct} / ${CLEAR_COUNT} もんせいかい`;
  const msgs = ['もう1かいちょうせん！', 'がんばったね！', 'よくできました！', 'かんぺき！'];
  document.getElementById('result-msg').textContent = msgs[Math.min(3, Math.floor(state.correct / 3))];

  const nextLv = state.level + 1;
  const btn    = document.getElementById('result-next-btn');
  if (cleared && nextLv <= 3) {
    btn.textContent = `レベル${nextLv}へ →`;
    btn.onclick = () => startGame(nextLv);
  } else if (cleared) {
    btn.textContent = '🏆 ぜんぶクリア！';
    btn.onclick = goTop;
    launchConfetti();
  } else {
    btn.textContent = 'もう1かい';
    btn.onclick = () => startGame(state.level);
  }
}

function goTop() { renderTop(); showScreen('screen-top'); }

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function shuffle(a) {
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// =============================================
// 紙吹雪
// =============================================
function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const ps  = Array.from({length:120}, () => ({
    x: Math.random() * canvas.width, y: -20,
    vx: (Math.random() - .5) * 4, vy: Math.random() * 4 + 2,
    color: ['#ff6b9d','#ffd93d','#6bcb77','#4d96ff','#ff6b6b'][Math.floor(Math.random()*5)],
    r: Math.random()*6+4, rot: Math.random()*360, rv: (Math.random()-.5)*8,
  }));
  let fr;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    for (const p of ps) {
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.rv;
      if (p.y < canvas.height+20) alive = true;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle = p.color; ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r); ctx.restore();
    }
    if (alive) fr = requestAnimationFrame(draw);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  cancelAnimationFrame(fr); draw();
  setTimeout(() => { cancelAnimationFrame(fr); ctx.clearRect(0,0,canvas.width,canvas.height); }, 4000);
}

// INIT
load(); renderTop();
</script>
